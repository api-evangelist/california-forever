aid: california-forever
name: California Forever
description: >-
  California Forever is a real estate and urban development company founded by
  Jan Sramek in 2017, backed by prominent Silicon Valley investors including
  Andreessen Horowitz (a16z), Laurene Powell Jobs, Reid Hoffman, Marc Andreessen,
  and Stripe co-founders Patrick and John Collison. Through its subsidiary
  Flannery Associates the company assembled roughly 60,000-70,000 acres of land
  in southeastern Solano County, California, and is planning a new walkable city
  for up to 400,000 residents alongside the Solano Foundry advanced manufacturing
  park and the Solano Shipyard. The company describes the effort as a $215 billion
  private investment intended to create hundreds of thousands of jobs, 170,000+
  new homes, and billions in annual tax revenue over 40 years. California Forever
  is a physical-development and land-use company; it publishes no public API,
  developer portal, SDKs, or machine-readable interfaces at this time.
